[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-execution-runtime"
version = "0.5.0"
description = "A durable, event-sourced execution runtime for AI agents (Milestone 4B: idempotency and crash-safe side effects)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "event-sourcing", "journal", "checkpoints", "recovery", "retries",
    "backoff", "idempotency", "agents", "runtime", "durability",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
